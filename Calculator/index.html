<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

    <title>Calculator</title>
</head>

<body class="">
    <div class="calculator">
        <div class="top">
            <div class="title">
                <h1>Calculator</h1>
                <div class="theme" id="icon">
                    <button class="theme-button"><i class="fa-solid fa-moon"></i></button>
                </div>
            </div>
            <textarea class="display" disabled></textarea>
        </div>
        <div class="buttons">
            <button class="btn clear">C</button>
            <button class="btn backspace"><i class="fa-solid fa-delete-left"></i></button>
            <button class="btn divide">/</button>
            <button class="btn multiply">*</button>
            <button class="btn seven">7</button>
            <button class="btn eight">8</button>
            <button class="btn nine">9</button>
            <button class="btn subtract">-</button>
            <button class="btn four">4</button>
            <button class="btn five">5</button>
            <button class="btn six">6</button>
            <button class="btn add">+</button>
            <button class="btn one">1</button>
            <button class="btn two">2</button>
            <button class="btn three">3</button>
            <button class="btn decimal">.</button>
            <button class="btn zero">0</button>
            <button class="btn double-zero">00</button>
            <button class="btn equals">=</button>
        </div>
    </div>
</body>

</html>
