<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Image Slideshow</title>
</head>
<body>
    <section class="container">
        <div class="slider-wrapper">
            <div class="slider">
                <img id="slide-1" src="mclaren1.jpg" alt="slider Image 1">
                <img id="slide-2" src="audi.jpeg" alt="slider Image 2">
                <img id="slide-3" src="mclaren.jpeg" alt="slider Image 3">
                <img id="slide-4" src="ferrari.jpeg" alt="slider Image 4">
                <img id="slide-5" src="camaro.jpeg" alt="slider Image 5">
            </div>
            <div class="slider-nav">
                <a href="#slide-1"></a></a>
                <a href="#slide-2"></a></a>
                <a href="#slide-3"></a></a>
                <a href="#slide-4"></a></a>
                <a href="#slide-5"></a></a>
            </div>
        </div>
    </section>


    <script src="app.js"></script>
</body>
</html>
